# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      all:
        patterns:
          - '*'
    labels:
      - 'dependencies'
  - package-ecosystem: 'composer'
    directories:
      - '/'
      - '/packages/*'
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      all:
        patterns:
          - '*'
    labels:
      - 'dependencies'
    ignore:
      # Version 5 moves namespaces and traits and changes the stored attribute
      # changes; it needs a planned migration across Core and its consumers.
      - dependency-name: 'spatie/laravel-activitylog'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/*'
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      all:
        patterns:
          - '*'
    labels:
      - 'dependencies'
