# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      all:
        patterns:
          - '*'
    labels:
      - 'dependencies'
  # Root lock: weekly so it cannot drift far from what CI resolves. Groups are
  # version-updates only, so security updates still arrive as their own PRs.
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      filament:
        applies-to: version-updates
        patterns:
          - 'filament/*'
      # Pest pins PHPUnit, paratest and symfony/process tightly; move together.
      testing:
        applies-to: version-updates
        patterns:
          - 'pestphp/*'
          - 'phpunit/*'
          - 'brianium/paratest'
          - 'symfony/process'
      laravel-symfony:
        applies-to: version-updates
        patterns:
          - 'laravel/*'
          - 'symfony/*'
      dev:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - '*'
      prod:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - '*'
    labels:
      - 'dependencies'
    ignore:
      # Version 5 moves namespaces and traits and changes the stored attribute
      # changes; it needs a planned migration across Core and its consumers.
      - dependency-name: 'spatie/laravel-activitylog'
        update-types: ['version-update:semver-major']
      # The October 2026 static-analysis bumps crash PHPStan with an internal
      # array_merge() error; hold them until a release is verified in CI.
      - dependency-name: 'phpstan/phpstan'
      - dependency-name: 'larastan/larastan'
      - dependency-name: 'tomasvotruba/type-coverage'
      - dependency-name: 'pestphp/pest-plugin-type-coverage'
      - dependency-name: 'pestphp/pest-plugin-phpstan'
      # 2.7.0 depends on the abandoned symplify/rule-doc-generator-contracts,
      # which fails composer audit.
      - dependency-name: 'driftingly/rector-laravel'
  - package-ecosystem: 'composer'
    directories:
      - '/packages/*'
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      all:
        patterns:
          - '*'
    labels:
      - 'dependencies'
    ignore:
      # Version 5 moves namespaces and traits and changes the stored attribute
      # changes; it needs a planned migration across Core and its consumers.
      - dependency-name: 'spatie/laravel-activitylog'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/*'
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    groups:
      all:
        patterns:
          - '*'
    labels:
      - 'dependencies'
