# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    labels:
      - 'dependencies'
  - package-ecosystem: 'composer'
    directories:
      - '/'
      - '/packages/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    labels:
      - 'dependencies'
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    labels:
      - 'dependencies'
