name: Build Frontend Package

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/check-package-build.mjs'
      - 'tests/JavaScript/package-build-check.test.mjs'
      - 'packages/frontend/**'
      - 'scripts/verify-nested-frontend-consumer.sh'
      - '.github/workflows/build-frontend-package.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-frontend-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    env:
      ROLLUP_SKIP_NATIVE: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test the build drift guard
        run: node --test ../../tests/JavaScript/package-build-check.test.mjs

      - name: Verify published frontend assets match their source
        run: node ../../scripts/check-package-build.mjs .

      - name: Test the published widget runtime
        run: node --experimental-vm-modules --test tests/JavaScript/published-widget-runtime.test.mjs

  nested-checkout-resolution:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      CAPELL_CHECKOUT: ${{ github.workspace }}/repositories/vendor/capell
    steps:
      - name: Checkout repository into a nested path
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repositories/vendor/capell

      - name: Use PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Use Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20.x'

      - name: Create a nested-path Laravel consumer
        env:
          CAPELL_NESTED_CONSUMER_ROOT: ${{ runner.temp }}/nested-consumer
        run: bash "${CAPELL_CHECKOUT}/scripts/verify-nested-frontend-consumer.sh"
