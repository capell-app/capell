name: Build Admin Package

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/check-package-build.mjs'
      - 'tests/JavaScript/package-build-check.test.mjs'
      - 'packages/admin/**'
      - '.github/workflows/build-packages.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-admin-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/admin
    env:
      ROLLUP_SKIP_NATIVE: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test the build drift guard
        run: node --test ../../tests/JavaScript/package-build-check.test.mjs

      - name: Verify published admin assets match their source
        run: node ../../scripts/check-package-build.mjs .
