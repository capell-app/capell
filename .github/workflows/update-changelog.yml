name: Queue credential probe (temporary, do not merge)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Probe marker
        required: true
        type: string

permissions: {}

jobs:
  credential-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create scoped installation token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MERGE_QUEUE_APP_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-merge-queues: write
      - name: Verify repository access
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const result = await github.rest.repos.get(context.repo);
            if (result.data.full_name !== 'capell-app/capell') throw new Error('Unexpected repository');
            core.info('Installation token can read the intended repository.');
