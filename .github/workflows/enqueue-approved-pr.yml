name: Enqueue approved pull request

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions: {}

concurrency:
  group: ready-to-merge-queue
  cancel-in-progress: false

jobs:
  enqueue:
    if: >-
      ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && github.event.label.name == 'ready-to-merge') || (github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check queue credential
        env:
          QUEUE_APP_ID: ${{ secrets.MERGE_QUEUE_APP_ID }}
          QUEUE_APP_KEY: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$QUEUE_APP_ID" || -z "$QUEUE_APP_KEY" ]]; then
            echo '::error::MERGE_QUEUE_APP_ID and MERGE_QUEUE_APP_PRIVATE_KEY must be configured; see docs/development/ci.md.'
            exit 1
          fi
      - name: Create queue installation token
        id: queue-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MERGE_QUEUE_APP_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-merge-queues: write
      - name: Enqueue the approved commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          QUEUE_TOKEN: ${{ steps.queue-token.outputs.token }}
        with:
          github-token: ${{ steps.queue-token.outputs.token }}
          script: |
            if (!process.env.QUEUE_TOKEN) throw new Error('Queue installation token is missing.');
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', base: 'main', per_page: 100,
            });
            const candidates = pulls
              .filter(pr => !pr.draft && pr.labels.some(label => label.name === 'ready-to-merge')
                && !pr.labels.some(label => label.name === 'awaiting-merge'))
              .sort((a, b) => a.created_at.localeCompare(b.created_at) || a.number - b.number);
            for (const candidate of candidates) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: candidate.number,
              });
              if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main'
                  || !pr.labels.some(label => label.name === 'ready-to-merge')
                  || pr.labels.some(label => label.name === 'awaiting-merge')) {
                throw new Error(`PR #${candidate.number} changed while the queue was being examined; retry.`);
              }
              if (pr.head.sha !== candidate.head.sha) {
                throw new Error(`PR #${candidate.number} changed during the queue scan; review its new head.`);
              }
              const state = await github.graphql(`
                query($id: ID!) {
                  node(id: $id) { ... on PullRequest { mergeQueue { id } mergeQueueEntry { id } } }
                }
              `, { id: pr.node_id });
              if (!state.node?.mergeQueue) throw new Error('The main branch has no merge queue configured.');
              if (state.node.mergeQueueEntry) {
                core.info(`PR #${pr.number} is already queued.`);
                continue;
              }
              // Stop on a failure: a newer PR must not pass an older labelled PR.
              const result = await github.graphql(`
                mutation($id: ID!, $sha: GitObjectID!) {
                  enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $sha}) {
                    mergeQueueEntry { id }
                  }
                }
              `, { id: pr.node_id, sha: pr.head.sha });
              if (!result.enqueuePullRequest.mergeQueueEntry) {
                throw new Error(`GitHub did not return a queue entry for PR #${pr.number}.`);
              }
              core.notice(`PR #${pr.number} was enqueued at ${pr.head.sha}; this does not yet mean it merged.`);
            }
