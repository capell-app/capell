name: Enqueue approved pull request

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  enqueue:
    if: github.event.label.name == 'ready-to-merge'
    runs-on: ubuntu-latest
    steps:
      - name: Enqueue the approved commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.MERGE_QUEUE_TOKEN }}
          script: |
            if (!process.env.QUEUE_TOKEN) throw new Error('Configure MERGE_QUEUE_TOKEN before enqueueing.');
            const number = process.env.PR_NUMBER;
            const sha = process.env.REVIEWED_SHA;
            if (!/^[1-9][0-9]*$/.test(number) || !/^[0-9a-f]{40}$/i.test(sha)) {
              throw new Error('Provide a positive PR number and the full reviewed 40-character SHA.');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(number),
            });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main') {
              throw new Error('The PR must be open, ready for review and target main.');
            }
            if (!pr.labels.some(label => label.name === 'ready-to-merge')) {
              throw new Error('The ready-to-merge label has been removed.');
            }
            if (pr.labels.some(label => label.name === 'awaiting-merge')) {
              throw new Error('The PR is held by the awaiting-merge label.');
            }
            if (pr.head.sha.toLowerCase() !== sha.toLowerCase()) {
              throw new Error('The PR head differs from the reviewed SHA; review it again.');
            }
            const result = await github.graphql(`
              mutation($id: ID!, $sha: GitObjectID!) {
                enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $sha}) {
                  mergeQueueEntry { id }
                }
              }
            `, { id: pr.node_id, sha });
            if (!result.enqueuePullRequest.mergeQueueEntry) {
              throw new Error('GitHub did not return a queue entry.');
            }
            core.notice(`PR #${number} was enqueued at ${sha}; this does not yet mean it merged.`);
