name: Merge approved pull request

# Adding `ready-to-merge` asks GitHub to merge the pull request through the main
# merge queue as soon as its required checks pass. The worker only reads pull
# request state through the API and never checks out or executes pull request code.
on:
  pull_request_target:
    types:
      [
        labeled,
        unlabeled,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
      ]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request to process. Leave blank to sweep every open ready-to-merge pull request.'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || inputs.pr_number || 'sweep' }}
  cancel-in-progress: false

jobs:
  enqueue:
    if: ${{ github.event_name == 'pull_request_target' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check queue credential
        env:
          QUEUE_APP_ID: ${{ secrets.MERGE_QUEUE_APP_ID }}
          QUEUE_APP_KEY: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$QUEUE_APP_ID" || -z "$QUEUE_APP_KEY" ]]; then
            echo '::error::MERGE_QUEUE_APP_ID and MERGE_QUEUE_APP_PRIVATE_KEY must be configured; see docs/development/ci.md.'
            exit 1
          fi
      - name: Create queue installation token
        id: queue-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MERGE_QUEUE_APP_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-merge-queues: write
      - name: Reconcile auto-merge with the ready-to-merge label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          QUEUE_TOKEN: ${{ steps.queue-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            if (!process.env.QUEUE_TOKEN) throw new Error('Queue installation token is missing.');
            const app = getOctokit(process.env.QUEUE_TOKEN);
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const numbers = process.env.PR_NUMBER
              ? [Number(process.env.PR_NUMBER)]
              : (await github.paginate(github.rest.pulls.list, {
                  ...context.repo, state: 'open', base: 'main', per_page: 100,
                })).filter(pr => pr.labels.some(label => label.name === 'ready-to-merge')).map(pr => pr.number);
            if (!numbers.length) {
              core.info('No open ready-to-merge pull requests.');
              return;
            }
            for (const number of numbers) {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
              const labels = pr.labels.map(label => label.name);
              const eligible = pr.state === 'open' && !pr.draft && pr.base.ref === 'main'
                && labels.includes('ready-to-merge') && !labels.includes('awaiting-merge');
              const read = await app.graphql(`
                query State($id: ID!) {
                  node(id: $id) { ... on PullRequest {
                    autoMergeRequest { enabledAt } mergeQueueEntry { id }
                  } }
                }
              `, { id: pr.node_id });
              if (!read.node) throw new Error(`Cannot inspect PR #${number}.`);
              const { autoMergeRequest, mergeQueueEntry } = read.node;
              if (!eligible) {
                if (autoMergeRequest && !mergeQueueEntry) {
                  await app.graphql(`
                    mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }
                  `, { id: pr.node_id });
                  core.notice(`PR #${number} is no longer eligible; auto-merge disabled.`);
                } else {
                  core.info(`PR #${number} is not eligible (draft, closed, unlabelled or held); nothing to do.`);
                }
                continue;
              }
              if (pr.head.repo?.full_name !== repository) {
                core.warning(`PR #${number} is from a fork; update and merge it manually.`);
                continue;
              }
              if (autoMergeRequest || mergeQueueEntry) {
                core.info(`PR #${number} is already set to merge${mergeQueueEntry ? ' and is in the merge queue' : ''}.`);
                continue;
              }
              try {
                await app.graphql(`
                  mutation($id: ID!, $sha: GitObjectID!) {
                    enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH, expectedHeadOid: $sha}) {
                      pullRequest { number }
                    }
                  }
                `, { id: pr.node_id, sha: pr.head.sha });
                core.notice(`PR #${number} will enter the merge queue when its required checks pass.`);
              } catch (error) {
                if (!/clean status|already.*(ready|mergeable)/i.test(String(error?.message))) throw error;
                await app.graphql(`
                  mutation($id: ID!, $sha: GitObjectID!) {
                    enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $sha}) {
                      mergeQueueEntry { id }
                    }
                  }
                `, { id: pr.node_id, sha: pr.head.sha });
                core.notice(`PR #${number} entered the merge queue immediately.`);
              }
            }
