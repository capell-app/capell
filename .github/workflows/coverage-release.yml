name: Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '*'

env:
  # Testbench builds the skeleton environment from its own .env.example whenever
  # the workbench directory holds no environment file, and that file ships
  # CACHE_STORE=database. `testbench optimize` then has laravel-data write its
  # cached structures into a `cache` table the in-memory sqlite connection has
  # never migrated. Test All pins the same three drivers for the same reason.
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array

jobs:
  generate-coverage:
    name: Generate coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CAPELL_TESTBENCH_RUNTIME_ROLE: true
    strategy:
      fail-fast: false
      matrix:
        php: [8.4]
        laravel: [13.*]
        db: [sqlite]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, intl, json, libxml, mbstring, simplexml, zip, pcov
          tools: composer:v2
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-cache-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-cache-

      - name: Cache PHPUnit coverage analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/phpunit
          key: ${{ runner.os }}-phpunit-cache-${{ hashFiles('composer.lock') }}-${{ github.sha }}-${{ matrix.shard }}
          restore-keys: |
            ${{ runner.os }}-phpunit-cache-${{ hashFiles('composer.lock') }}
            ${{ runner.os }}-phpunit-cache-

      - name: Check Composer public files
        run: php scripts/check-composer-local-paths.php

      - name: Check Composer lock file
        run: composer run check:composer-lock

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --ansi --optimize-autoloader

      - name: Configure environment
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      - name: Run release coverage shard (Clover)
        run: |
          mkdir -p coverage
          composer run prepare
          php scripts/run-testbench-command.php optimize --except=routes --ansi
          php -d max_execution_time=0 -d pcov.enabled=1 -d pcov.directory=packages -d pcov.exclude='~/(tests|testbench-core)/~' vendor/bin/pest --coverage-clover=coverage/clover-${{ matrix.shard }}.xml --parallel --shard=${{ matrix.shard }}/4 --colors=always --stop-on-error --stop-on-failure --configuration=phpunit-coverage.xml

      - name: Upload Clover XML for codecov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pest-coverage-clover-${{ matrix.shard }}
          path: coverage/clover-${{ matrix.shard }}.xml

  merge-coverage:
    name: Merge coverage and enforce threshold
    needs: generate-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: dom
          coverage: none

      - name: Download Clover shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pest-coverage-clover-*
          path: coverage/shards
          merge-multiple: true

      - name: Merge Clover shards and enforce 90% coverage
        run: php scripts/merge-clover-coverage.php --output coverage/clover.xml coverage/shards/clover-{1,2,3,4}.xml

      - name: Upload merged Clover XML for Codecov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pest-coverage-clover
          path: coverage/clover.xml

  publish-coverage:
    name: Publish coverage
    needs: merge-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Clover XML
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pest-coverage-clover
          path: coverage

      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage/clover.xml
          use_oidc: true
          version: v11.3.1
