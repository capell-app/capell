name: Test All

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/**/*.php'
      - 'packages/**/composer.json'
      - 'tests/**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'docs/packages/catalog.md'
      - 'scripts/**/*.php'
      - 'docs/getting-started/install.md'
      - 'docs/getting-started/quickstart.md'
      - '.docker/Dockerfile'
      - '.github/workflows/test-fast-pr.yml'
      - '.github/workflows/test-full.yml'
      - 'phpunit.xml'
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref }}-phpunit-full
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    name: Fast PR gate
    uses: ./.github/workflows/test-fast-pr.yml

  sentinel:
    needs: fast-pr
    if: >-
      always()
      && (needs.fast-pr.result == 'success' || needs.fast-pr.result == 'skipped')
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Sentinel - portability, cache, migrations, destructive schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CACHE_STORE: array
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.ACCESS_TOKEN }}"} }'
      PAO_DISABLE: 1

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_cms_sentinel
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache PHP dependencies
        id: php-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: dependencies-php-8.4-laravel-12-testbench-10-sentinel-${{ hashFiles('composer.json', 'composer.lock', '.github/workflows/test-full.yml') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          extensions: curl, dom, fileinfo, gd, intl, json, libxml, mbstring, pdo_mysql, pdo_sqlite, simplexml, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Check Composer inputs
        run: |
          php scripts/check-composer-local-paths.php
          composer run check:composer-lock

      - name: Install PHP dependencies
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          composer remove --no-interaction --no-progress --ansi --dev --no-update laravel/pao
          composer require --no-interaction --no-progress --ansi --no-update "laravel/framework:12.*"
          composer require --no-interaction --no-progress --ansi --dev --no-update "orchestra/testbench:10.*"
          composer update --no-interaction --no-progress --ansi --optimize-autoloader --with-all-dependencies -W

      - name: Run portability and cache-isolation sentinel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          NO_COLOR: 1
          PEST_JUNIT_LOG: junit-sentinel-unit.xml
        run: composer run test:sentinel:unit:ci

      - name: Run migrations and destructive-schema sentinel
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          DB_DATABASE: test_cms_sentinel
          DB_USERNAME: root
          DB_PASSWORD: root
          NO_COLOR: 1
          PEST_JUNIT_LOG: junit-sentinel-database.xml
        run: composer run test:sentinel:database:ci

      - name: Upload sentinel JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-sentinel
          path: junit-sentinel-*.xml
          if-no-files-found: warn

  test-behaviour:
    needs: sentinel
    name: Test All - P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.test_suite }} - DBmysql
    runs-on: ubuntu-latest
    env:
      CACHE_STORE: array
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.ACCESS_TOKEN }}"} }'
      PAO_DISABLE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            test_suite: Feature
            test_suite_slug: feature
            artifact_slug: l12-feature
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            test_suite: Integration
            test_suite_slug: integration
            artifact_slug: l12-integration
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            test_suite: Feature
            test_suite_slug: feature
            artifact_slug: l13-feature
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            test_suite: Integration
            test_suite_slug: integration
            artifact_slug: l13-integration

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_cms_multi
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache PHP dependencies
        id: php-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: dependencies-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-testbench-${{ matrix.testbench }}-mysql-${{ hashFiles('composer.json', 'composer.lock', '.github/workflows/test-full.yml') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, intl, json, libxml, mbstring, pdo_mysql, pdo_sqlite, simplexml, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Check Composer inputs
        run: |
          php scripts/check-composer-local-paths.php
          composer run check:composer-lock

      - name: Install PHP dependencies
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          composer remove --no-interaction --no-progress --ansi --dev --no-update laravel/pao
          composer require --no-interaction --no-progress --ansi --no-update \
            "laravel/framework:${{ matrix.laravel }}"
          composer require --no-interaction --no-progress --ansi --dev --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --no-interaction --no-progress --ansi --optimize-autoloader --with-all-dependencies -W

      - name: Tune MySQL for the write-heavy test suite
        run: |
          mysql \
            --host=127.0.0.1 \
            --port="${{ job.services.mysql.ports['3306'] }}" \
            --user=root \
            --password=root \
            --execute="
              SET GLOBAL innodb_redo_log_capacity = 2147483648;
              SET GLOBAL innodb_flush_log_at_trx_commit = 2;
              SET GLOBAL sync_binlog = 0;
            "

      - name: Run ${{ matrix.test_suite }} tests
        id: run-tests
        shell: bash
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          DB_DATABASE: test_cms_multi
          DB_USERNAME: root
          DB_PASSWORD: root
          NO_COLOR: 1
          PEST_JUNIT_LOG: junit-${{ matrix.test_suite_slug }}.xml
          PEST_TEST_SUITE: ${{ matrix.test_suite }}
        run: |
          set -o pipefail
          composer run test:database:ci 2>&1 | tee "pest-output-${{ matrix.test_suite_slug }}.txt"

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.artifact_slug }}
          path: junit-${{ matrix.test_suite_slug }}.xml
          if-no-files-found: warn

      - name: Extract engineering metrics
        id: engineering-metrics
        if: success() && matrix.laravel == '12.*'
        run: |
          php scripts/extract-pest-metrics.php "pest-output-${{ matrix.test_suite_slug }}.txt" --github-output
          php scripts/extract-phpstan-level.php --github-output

      - name: Write engineering metrics artifact
        if: success() && matrix.laravel == '12.*'
        env:
          TESTS: ${{ steps.engineering-metrics.outputs.tests }}
          ASSERTIONS: ${{ steps.engineering-metrics.outputs.assertions }}
          PHPSTAN_LEVEL: ${{ steps.engineering-metrics.outputs.phpstan_level }}
        run: |
          php -r 'file_put_contents(
              "engineering-metrics-${{ matrix.test_suite_slug }}.json",
              json_encode([
                  "tests" => (int) getenv("TESTS"),
                  "assertions" => (int) getenv("ASSERTIONS"),
                  "phpstan_level" => (int) getenv("PHPSTAN_LEVEL"),
              ], JSON_THROW_ON_ERROR | JSON_PRETTY_PRINT) . PHP_EOL,
          );'

      - name: Upload engineering metrics artifact
        if: success() && matrix.laravel == '12.*'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-metrics-l12-${{ matrix.test_suite_slug }}
          path: engineering-metrics-${{ matrix.test_suite_slug }}.json
          if-no-files-found: error

  test-unit:
    needs: sentinel
    name: Test All - P${{ matrix.php }} - L${{ matrix.laravel }} - Unit - ${{ matrix.package }}
    runs-on: ubuntu-latest
    env:
      CACHE_STORE: array
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.ACCESS_TOKEN }}"} }'
      PAO_DISABLE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            package: Core
            test_group: core
            package_slug: core
            artifact_slug: l12-unit-core
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            package: Admin
            test_group: admin
            package_slug: admin
            artifact_slug: l12-unit-admin
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            package: Frontend
            test_group: frontend
            package_slug: frontend
            artifact_slug: l12-unit-frontend
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            package: Installer
            test_group: installer
            package_slug: installer
            artifact_slug: l12-unit-installer
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            package: Marketplace
            test_group: marketplace
            package_slug: marketplace
            artifact_slug: l12-unit-marketplace
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            package: Core
            test_group: core
            package_slug: core
            artifact_slug: l13-unit-core
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            package: Admin
            test_group: admin
            package_slug: admin
            artifact_slug: l13-unit-admin
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            package: Frontend
            test_group: frontend
            package_slug: frontend
            artifact_slug: l13-unit-frontend
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            package: Installer
            test_group: installer
            package_slug: installer
            artifact_slug: l13-unit-installer
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            package: Marketplace
            test_group: marketplace
            package_slug: marketplace
            artifact_slug: l13-unit-marketplace

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache PHP dependencies
        id: php-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: dependencies-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-testbench-${{ matrix.testbench }}-sqlite-${{ hashFiles('composer.json', 'composer.lock', '.github/workflows/test-full.yml') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, intl, json, libxml, mbstring, pdo_sqlite, simplexml, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Check Composer inputs
        run: |
          php scripts/check-composer-local-paths.php
          composer run check:composer-lock

      - name: Install PHP dependencies
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          composer remove --no-interaction --no-progress --ansi --dev --no-update laravel/pao
          composer require --no-interaction --no-progress --ansi --no-update \
            "laravel/framework:${{ matrix.laravel }}"
          composer require --no-interaction --no-progress --ansi --dev --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --no-interaction --no-progress --ansi --optimize-autoloader --with-all-dependencies -W

      - name: Run ${{ matrix.package }} Unit tests
        shell: bash
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          NO_COLOR: 1
          PEST_JUNIT_LOG: junit-unit-${{ matrix.package_slug }}.xml
          PEST_TEST_GROUP: ${{ matrix.test_group }}
        run: |
          set -o pipefail
          composer run test:database:package:ci 2>&1 | tee "pest-output-unit-${{ matrix.package_slug }}.txt"

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.artifact_slug }}
          path: junit-unit-${{ matrix.package_slug }}.xml
          if-no-files-found: warn

      - name: Extract engineering metrics
        id: engineering-metrics
        if: success() && matrix.laravel == '12.*'
        run: |
          php scripts/extract-pest-metrics.php "pest-output-unit-${{ matrix.package_slug }}.txt" --github-output
          php scripts/extract-phpstan-level.php --github-output

      - name: Write engineering metrics artifact
        if: success() && matrix.laravel == '12.*'
        env:
          TESTS: ${{ steps.engineering-metrics.outputs.tests }}
          ASSERTIONS: ${{ steps.engineering-metrics.outputs.assertions }}
          PHPSTAN_LEVEL: ${{ steps.engineering-metrics.outputs.phpstan_level }}
        run: |
          php -r 'file_put_contents(
              "engineering-metrics-unit-${{ matrix.package_slug }}.json",
              json_encode([
                  "tests" => (int) getenv("TESTS"),
                  "assertions" => (int) getenv("ASSERTIONS"),
                  "phpstan_level" => (int) getenv("PHPSTAN_LEVEL"),
              ], JSON_THROW_ON_ERROR | JSON_PRETTY_PRINT) . PHP_EOL,
          );'

      - name: Upload engineering metrics artifact
        if: success() && matrix.laravel == '12.*'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-metrics-l12-unit-${{ matrix.package_slug }}
          path: engineering-metrics-unit-${{ matrix.package_slug }}.json
          if-no-files-found: error

  engineering-metrics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Aggregate engineering metrics
    needs: [test-behaviour, test-unit]
    runs-on: ubuntu-latest
    steps:
      - name: Download engineering metrics artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engineering-metrics-l12-*
          path: engineering-metrics
          merge-multiple: true

      - name: Aggregate engineering metrics
        id: engineering-metrics
        run: |
          php <<'PHP'
          <?php
          $files = glob('engineering-metrics/*.json');

          if ($files === false || count($files) !== 7) {
              throw new RuntimeException('Expected engineering metrics from two behaviour suites and five Unit packages.');
          }

          $tests = 0;
          $assertions = 0;
          $phpstanLevels = [];

          foreach ($files as $file) {
              $metrics = json_decode((string) file_get_contents($file), true, flags: JSON_THROW_ON_ERROR);
              $tests += (int) ($metrics['tests'] ?? 0);
              $assertions += (int) ($metrics['assertions'] ?? 0);
              $phpstanLevels[] = (int) ($metrics['phpstan_level'] ?? 0);
          }

          $phpstanLevels = array_values(array_unique($phpstanLevels));

          if (count($phpstanLevels) !== 1) {
              throw new RuntimeException('Laravel 12 test jobs reported inconsistent PHPStan levels.');
          }

          file_put_contents(
              getenv('GITHUB_OUTPUT'),
              "tests={$tests}\nassertions={$assertions}\nphpstan_level={$phpstanLevels[0]}\n",
              FILE_APPEND,
          );

          fwrite(STDOUT, "Aggregated engineering metrics: tests={$tests}, assertions={$assertions}, phpstan_level={$phpstanLevels[0]}\n");
          PHP

      - name: Send repository_dispatch to capell-app
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ENGINEERING_METRICS_DISPATCH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          script: |
            if (!process.env.ENGINEERING_METRICS_DISPATCH_TOKEN) {
              core.setFailed('Missing ACCESS_TOKEN secret.');
              return;
            }

            const client_payload = {
              source: 'capell',
              tests: Number(`${{ steps.engineering-metrics.outputs.tests }}`),
              assertions: Number(`${{ steps.engineering-metrics.outputs.assertions }}`),
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              sha: context.sha,
              phpstan_level: Number(`${{ steps.engineering-metrics.outputs.phpstan_level }}`),
            };

            await github.rest.repos.createDispatchEvent({
              owner: 'capell-app',
              repo: 'capell-app',
              event_type: 'engineering-metrics',
              client_payload,
            });

            core.info(`Dispatched engineering-metrics: ${JSON.stringify(client_payload)}`);
