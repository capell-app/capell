name: Merge queue test safety

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read

concurrency:
  group: merge-queue-test-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Merge queue test scope
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'merge_group' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the merge group changes anything the matrix tests
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT_NAME" != "merge_group" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The glob magic gives these entries GitHub's own path-filter meaning,
          # where ** also matches zero directories (a file directly under tests/).
          mapfile -t pathspecs < .github/ci/test-all-paths.txt
          pathspecs=("${pathspecs[@]/#/:(glob)}")
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "${pathspecs[@]}")"
          if [ -n "$changed" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No changed file is covered by .github/ci/test-all-paths.txt; the full matrix is skipped."
          fi

  full-matrix:
    needs: scope
    # A failed scope job must not skip the matrix, so it also runs whenever the scope could not be decided.
    if: ${{ !cancelled() && github.event_name == 'merge_group' && (needs.scope.result != 'success' || needs.scope.outputs.relevant == 'true') }}
    uses: ./.github/workflows/test-full.yml
    with:
      merge_queue_evidence: true

  evidence-tests:
    name: Merge queue evidence validator tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the evidence validator
        run: python3 -B -m unittest discover -s tests/Shell -p 'test_merge_group_*.py'

  gate:
    name: Merge queue full matrix
    if: always()
    needs: [scope, full-matrix, evidence-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow results
        env:
          EVENT_NAME: ${{ github.event_name }}
          MATRIX_REQUIRED: ${{ github.event_name == 'merge_group' && (needs.scope.result != 'success' || needs.scope.outputs.relevant == 'true') }}
          MATRIX_RESULT: ${{ needs.full-matrix.result }}
          VALIDATOR_RESULT: ${{ needs.evidence-tests.result }}
        run: bash scripts/check-merge-group-workflow-result.sh
      - name: Setup PHP
        if: needs.full-matrix.result == 'success'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom
          coverage: none
      - name: Download matrix reports
        if: needs.full-matrix.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merge-group-evidence/junit
      - name: Download sentinel reports
        if: needs.full-matrix.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-all-sentinel-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merge-group-evidence/sentinel-attempt-${{ github.run_attempt }}
      - name: Verify completed tests for every matrix cell
        if: needs.full-matrix.result == 'success'
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/merge-group-evidence
        run: |
          php scripts/test-all-matrix.php all > "$RUNNER_TEMP/merge-group-matrix.json"
          python3 scripts/check-merge-group-test-evidence.py "$RUNNER_TEMP/merge-group-matrix.json" "$EVIDENCE_DIR" "$GITHUB_RUN_ATTEMPT"
