name: PHP Quality

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: php-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    if: github.actor != 'dependabot[bot]'
    name: PHP Quality scope
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the changed files need the PHP quality gate
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The glob magic gives these entries GitHub's own path-filter meaning,
          # where ** also matches zero directories (a file directly under tests/).
          mapfile -t pathspecs < .github/ci/php-quality-paths.txt
          pathspecs=("${pathspecs[@]/#/:(glob)}")
          if [ -n "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- "${pathspecs[@]}")" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No changed file is covered by .github/ci/php-quality-paths.txt; the PHP quality gate is skipped."
          fi

  quality:
    # Always present as a required check: the scope job decides whether the
    # gate runs, so a pull request touching only unrelated files reports a
    # skipped (passing) result instead of never reporting.
    name: PHP Quality (8.4)
    needs: scope
    # A failed scope job must not turn the required check into a skipped pass,
    # so the gate also runs whenever the scope could not be decided.
    if: ${{ github.actor != 'dependabot[bot]' && (!cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.relevant == 'true')) }}
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.ACCESS_TOKEN }}"} }'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, intl, json, libxml, mbstring, phar, simplexml, zip
          tools: composer:v2, pint

      - name: Check Composer public files
        run: php scripts/check-composer-local-paths.php

      - name: Check Composer lock file
        run: composer run check:composer-lock

      - name: Check split repository health
        run: composer run check:split-repository-health

      - name: Check root documentation
        run: composer run check:root-docs

      - name: Check README engineering standards
        run: composer run check:readme-engineering-standards

      - name: Check documentation links
        run: composer run check:docs-links

      - name: Check documentation orphans
        run: composer run check:docs-orphans

      - name: Check documented requirements
        run: composer run check:docs-requirements

      - name: Check documented env vars
        run: composer run check:docs-env

      - name: Check documented config keys
        run: composer run check:docs-config

      - name: Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --no-progress --ansi --optimize-autoloader

      - name: Check documented Artisan commands
        run: composer run check:docs-commands

      - name: Check package dependency contract
        run: composer run check:package-dependencies

      - name: Run Pint check
        run: composer cs:check

      - name: Cache PHPStan result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/phpstan/full
          key: phpstan-${{ runner.os }}-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan/**/*.neon') }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ runner.os }}-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan/**/*.neon') }}-
            phpstan-${{ runner.os }}-

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHPStan deprecation rules
        continue-on-error: true
        run: composer phpstan:deprecations

      - name: Check PHPStan baseline did not grow
        run: composer phpstan:baseline-check

      - name: Run Composer audit
        run: composer audit --locked

      - name: Apply Rector transformations
        run: composer rector

      - name: Verify Rector left no uncommitted changes
        run: git diff --exit-code

      - name: Run modernization verifier advisory
        continue-on-error: true
        run: composer skill:verify

      - name: Upload modernization artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: php-modernization-${{ github.run_id }}
          path: .build/php-modernization/
          if-no-files-found: ignore
