name: PHP Quality

on:
  merge_group:
    types: [checks_requested]
  # Caches saved on main are the only ones every pull request can restore;
  # merge-group and pull request caches stay scoped to their own refs.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: php-quality-${{ github.ref }}
  # A newer push supersedes a pull request run, and a newer merge supersedes a main run (which
  # only refreshes the caches). Merge-group runs are required checks and are never cancelled.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  scope:
    if: github.event_name == 'merge_group' || github.actor != 'dependabot[bot]'
    name: PHP Quality scope
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the changed files need the PHP quality gate
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The glob magic gives these entries GitHub's own path-filter meaning,
          # where ** also matches zero directories (a file directly under tests/).
          mapfile -t pathspecs < .github/ci/php-quality-paths.txt
          pathspecs=("${pathspecs[@]/#/:(glob)}")
          if [ -n "$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- "${pathspecs[@]}")" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No changed file is covered by .github/ci/php-quality-paths.txt; the PHP quality gate is skipped."
          fi

  quality:
    # Always present as a required check: the scope job decides whether the
    # gate runs, so a pull request touching only unrelated files reports a
    # skipped (passing) result instead of never reporting.
    name: PHP Quality (8.4)
    needs: scope
    # A failed scope job must not turn the required check into a skipped pass,
    # so the gate also runs whenever the scope could not be decided.
    if: ${{ (github.event_name == 'merge_group' || github.actor != 'dependabot[bot]') && (!cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.relevant == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, intl, json, libxml, mbstring, phar, simplexml, zip
          tools: composer:v2, pint

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22.x'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Check Composer public files
        run: php scripts/check-composer-local-paths.php

      - name: Check Composer lock file
        run: composer run check:composer-lock

      - name: Check split repository health
        run: composer run check:split-repository-health

      - name: Check root documentation
        run: composer run check:root-docs

      - name: Check README engineering standards
        run: composer run check:readme-engineering-standards

      - name: Check documentation links
        run: composer run check:docs-links

      - name: Check documentation orphans
        run: composer run check:docs-orphans

      - name: Check documented requirements
        run: composer run check:docs-requirements

      - name: Check documented env vars
        run: composer run check:docs-env

      - name: Check documented config keys
        run: composer run check:docs-config

      - name: Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: >-
          composer install --no-interaction --no-progress --ansi
          --optimize-autoloader --no-scripts --no-plugins

      - name: Prepare PHP autoload environment without credentials
        run: composer dump-autoload --no-interaction

      - name: Check locked dependency versions and audited holds
        run: php scripts/check-composer-major-constraints.php

      - name: Check queue contract
        run: composer run check:queue-contract

      - name: Check language key drift
        run: composer run check:lang-keys

      - name: Check documented Artisan commands
        run: composer run check:docs-commands

      - name: Check package dependency contract
        run: composer run check:package-dependencies

      - name: Check Agent Schema contract
        run: composer run check:agent-schema

      - name: Check Prettier formatting
        run: composer prettier:check

      - name: Run ESLint
        run: composer eslint

      - name: Run Pint check
        run: composer cs:check

      - name: Cache PHPStan result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            var/phpstan/full
            var/phpstan/deprecations
          key: phpstan-${{ runner.os }}-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan/**/*.neon') }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ runner.os }}-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan/**/*.neon') }}-
            phpstan-${{ runner.os }}-

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHPStan deprecation rules
        continue-on-error: true
        run: composer phpstan:deprecations

      - name: Check PHPStan baseline did not grow
        run: composer phpstan:baseline-check

      - name: Run Composer audit
        run: composer audit --locked

      - name: Cache Rector result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/rector
          key: rector-${{ runner.os }}-${{ hashFiles('composer.lock', 'rector.php', 'packages/*/rector.php') }}-${{ github.sha }}
          restore-keys: |
            rector-${{ runner.os }}-${{ hashFiles('composer.lock', 'rector.php', 'packages/*/rector.php') }}-
            rector-${{ runner.os }}-

      - name: Apply Rector transformations
        run: composer rector

      - name: Verify Rector left no uncommitted changes
        run: git diff --exit-code

      - name: Run modernization verifier advisory
        continue-on-error: true
        run: composer skill:verify

      - name: Upload modernization artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: php-modernization-${{ github.run_id }}
          path: .build/php-modernization/
          if-no-files-found: ignore
