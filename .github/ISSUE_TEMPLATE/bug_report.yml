name: Bug report
description: Report a reproducible problem in Capell
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do **not** use this
        form for undisclosed security vulnerabilities — see
        [SECURITY.md](https://github.com/capell-app/capell/security/policy)
        instead.
  - type: input
    id: capell-version
    attributes:
      label: Capell version
      description: The version of the Capell package(s) you have installed (e.g. `1.0.24`).
      placeholder: "1.0.24"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4.1"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "13.0"
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - MySQL
        - MariaDB
        - SQLite
        - Other (describe in reproduction steps)
    validations:
      required: true
  - type: input
    id: database-version
    attributes:
      label: Database version
      placeholder: "8.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce, ideally from a fresh install.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant error output, stack traces, or `laravel.log` excerpts. This will be rendered as a code block automatically.
      render: shell
    validations:
      required: false
