exclude: ^(node_modules|vendor|\.pre-commit-config\.yaml)$
# Hooks whose manifest declares no stages run at commit time only; the few
# pre-commit-hooks entries that declare push stages are pinned below.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
        # Generated bundles are byte-compared against a fresh build in CI.
        exclude: ^(tests/\.pest/snapshots/|packages/[^/]+/publishes/(build|dist)/)
        stages: [pre-commit]
      - id: trailing-whitespace
        exclude: ^packages/[^/]+/publishes/(build|dist)/
        stages: [pre-commit]
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ['--maxkb=1024']
        exclude: packages/admin/publishes/build/js/components/html-code-editor.js
        stages: [pre-commit]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: index-integrity
        name: git index integrity
        entry: scripts/guards/index-integrity.sh
        language: script
        always_run: true
        pass_filenames: false
      - id: hook-safety-regression
        name: Git hook safety regression
        entry: python3 -B tests/Shell/test_safe_pre_commit.py
        language: system
        files: ^(scripts/hooks/|tests/Shell/test_safe_pre_commit\.py$|\.pre-commit/(pint|prettier)\.sh$)
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]
      - id: pre-commit-phpstan
        name: PHPStan new errors over staged PHP files
        entry: scripts/guards/pre-commit-analysis.sh
        language: script
        files: ^(packages|tests)/.+\.php$|^scripts/benchmark-boot(-child|-support)?\.php$
        types: [file]
        require_serial: true
        stages: [pre-commit]
      - id: pre-push-phpstan
        name: PHPStan over changed files before push
        entry: scripts/guards/pre-push-analysis.sh
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: donotcommit
        name: DO NOT COMMIT check
        entry: 'do not commit|DO NOT COMMIT'
        args: [--multiline]
        language: pygrep
        types: [text]
        # Also over the pushed range, and in CI through scripts/guards/check-commit-range.sh.
        stages: [pre-commit, pre-push, manual]
      - id: checkfordebugging
        name: check for debugging methods
        description: 'Check the dd(), dump() or any ray() methods have not been left in'
        entry: python3 scripts/check-debugging.py
        language: system
        # Also over the pushed range, and in CI through scripts/guards/check-commit-range.sh.
        stages: [pre-commit, pre-push, manual]
        exclude: ^(packages/admin/publishes/build/js/components/html-code-editor.js|scripts/testing/with-release-lock\.py|tests/Shell/release-verification-lock\.py|scripts/audit-language-keys.sh)$
        types: [text]
      - id: pint
        name: Laravel Pint
        description: Run Laravel Pint against all staged PHP files.
        entry: .pre-commit/pint.sh
        language: script
        types: [php]
      - id: rector
        name: Rector
        description: Fail when Rector would still rewrite a staged PHP file.
        entry: .pre-commit/rector.sh
        language: script
        require_serial: true
        types: [php]
        stages: [pre-commit]
      - id: prettier
        name: Format code with Prettier
        entry: .pre-commit/prettier.sh
        require_serial: true
        language: script
        files: \.blade\.php$|\.css$|\.js$|\.yml$
        stages: [pre-commit]
      - id: composer-public-files-no-local-paths
        name: Composer public files do not use local paths
        entry: php scripts/check-composer-local-paths.php
        language: system
        pass_filenames: false
        files: ^composer\.(json|lock)$
        stages: [pre-commit]
      - id: composer-lock-in-sync
        name: Composer lock file is in sync
        entry: composer validate --no-check-publish
        language: system
        pass_filenames: false
        files: ^composer\.(json|lock)$
        stages: [pre-commit]
