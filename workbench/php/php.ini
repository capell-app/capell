memory_limit = -1
display_errors = Off
log_errors = On
; Testbench disables the getenv adapter; expose fixture environment through $_ENV.
variables_order = EGPCS

; The development server defaults max_input_time to 60 seconds and its workers
; can be killed by that timer long after the request that armed it ("Maximum
; execution time of 0+2 seconds exceeded"), failing the capture batch running
; at the time. Captures bound their own time, so disable it.
max_input_time = -1
